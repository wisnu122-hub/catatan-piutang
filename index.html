<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Piutang</title>
    
    <!-- Tailwind CSS untuk tampilan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM untuk logika aplikasi -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel agar browser mengerti bahasa React (JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* CSS tambahan untuk menyembunyikan scrollbar tapi tetap bisa discroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #f3f4f6; }
    </style>
</head>
<body>
    <!-- Area dimana aplikasi akan dimuat -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICON COMPONENTS (Menggantikan Lucide agar 100% Offline) ---
        const IconSearch = () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>;
        const IconPlus = () => <svg width="28" height="28" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 5v14M5 12h14"></path></svg>;
        const IconChevronLeft = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>;
        const IconEdit = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path><path strokeLinecap="round" strokeLinejoin="round" d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconTrash = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"></path></svg>;
        const IconCreditCard = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2" strokeLinecap="round" strokeLinejoin="round"></rect><path strokeLinecap="round" strokeLinejoin="round" d="M1 10h22"></path></svg>;
        const IconInfo = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" strokeLinecap="round" strokeLinejoin="round"></circle><path strokeLinecap="round" strokeLinejoin="round" d="M12 16v-4M12 8h.01"></path></svg>;
        const IconReceipt = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M22 21.01L19.53 19l-2.47 2.01L14.6 19l-2.47 2.01L9.65 19 7.18 21.01 4.7 19 2 21.01V3a2 2 0 012-2h16a2 2 0 012 2v18.01zM16 11h-8M16 15h-8M10 7H8"></path></svg>;
        const IconPrint = () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"></path><path strokeLinecap="round" strokeLinejoin="round" d="M14 2v6h6M16 13H8M16 17H8M10 9H8"></path></svg>;

        // --- FORMATTER ---
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency', currency: 'IDR',
                minimumFractionDigits: 0, maximumFractionDigits: 0
            }).format(angka || 0);
        };

        const formatDate = (timestamp) => {
            return new Intl.DateTimeFormat('id-ID', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            }).format(new Date(timestamp));
        };

        // --- MAIN APPLICATION ---
        function App() {
            // State Utama (Ambil dari LocalStorage saat pertama kali load)
            const [piutangs, setPiutangs] = useState(() => {
                const savedData = localStorage.getItem('data_piutang_app');
                return savedData ? JSON.parse(savedData) : [];
            });
            
            // Simpan otomatis ke LocalStorage setiap kali ada perubahan pada state piutangs
            useEffect(() => {
                localStorage.setItem('data_piutang_app', JSON.stringify(piutangs));
            }, [piutangs]);

            // State Navigasi & Form
            const [currentView, setCurrentView] = useState('home');
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedPayment, setSelectedPayment] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [formNama, setFormNama] = useState('');
            const [formPiutang, setFormPiutang] = useState('');
            const [formPayment, setFormPayment] = useState('');

            // Kalkulasi Total
            const totals = useMemo(() => {
                return piutangs.reduce((acc, curr) => {
                    acc.piutang += curr.piutang;
                    acc.pembayaran += curr.total_pembayaran;
                    acc.saldo += curr.saldo;
                    return acc;
                }, { piutang: 0, pembayaran: 0, saldo: 0 });
            }, [piutangs]);

            // Filter Pencarian
            const filteredPiutangs = useMemo(() => {
                if (!searchQuery) return piutangs;
                return piutangs.filter(p => p.nama.toLowerCase().includes(searchQuery.toLowerCase()));
            }, [piutangs, searchQuery]);

            // Aksi-aksi Form
            const handleAddSubmit = (e) => {
                e.preventDefault();
                const amount = Number(formPiutang.replace(/\D/g, ''));
                if (amount <= 0 || !formNama) return;

                const newData = {
                    id: 'PTG-' + Date.now(),
                    nama: formNama,
                    piutang: amount,
                    total_pembayaran: 0,
                    saldo: amount,
                    status: 'BELUM LUNAS',
                    created_at: Date.now(),
                    pembayaran: []
                };

                setPiutangs([newData, ...piutangs]);
                setCurrentView('home');
                setFormNama('');
                setFormPiutang('');
            };

            const handleEditSubmit = (e) => {
                e.preventDefault();
                const amount = Number(formPiutang.replace(/\D/g, ''));
                
                if (amount < selectedItem.total_pembayaran) {
                    alert("Total piutang tidak boleh lebih kecil dari total pembayaran yang sudah dilakukan.");
                    return;
                }

                const newSaldo = amount - selectedItem.total_pembayaran;
                const updatedPiutangs = piutangs.map(p => {
                    if (p.id === selectedItem.id) {
                        return { 
                            ...p, 
                            nama: formNama, 
                            piutang: amount, 
                            saldo: newSaldo,
                            status: newSaldo <= 0 ? 'LUNAS' : 'BELUM LUNAS'
                        };
                    }
                    return p;
                });

                setPiutangs(updatedPiutangs);
                setCurrentView('home');
            };

            const handlePaySubmit = (e) => {
                e.preventDefault();
                const amount = Number(formPayment.replace(/\D/g, ''));
                
                if (amount > selectedItem.saldo) {
                    alert(`Pembayaran tidak boleh melebihi sisa saldo (${formatRupiah(selectedItem.saldo)}).`);
                    return;
                }

                const paymentRecord = {
                    id: `KWT-${Date.now()}`,
                    tanggal: Date.now(),
                    jumlah: amount,
                    saldo_setelah_pembayaran: selectedItem.saldo - amount,
                    nomor_kuitansi: `KWT-${Date.now()}`
                };

                const updatedPiutangs = piutangs.map(p => {
                    if (p.id === selectedItem.id) {
                        const newTotal = p.total_pembayaran + amount;
                        const newSaldo = p.piutang - newTotal;
                        return {
                            ...p,
                            total_pembayaran: newTotal,
                            saldo: newSaldo,
                            status: newSaldo <= 0 ? 'LUNAS' : 'BELUM LUNAS',
                            pembayaran: [...p.pembayaran, paymentRecord]
                        };
                    }
                    return p;
                });

                setPiutangs(updatedPiutangs);
                setFormPayment('');
                setCurrentView('home');
            };

            const handleDelete = (item) => {
                if (item.total_pembayaran > 0) {
                    if (!window.confirm(`Peringatan: ${item.nama} sudah membayar ${formatRupiah(item.total_pembayaran)}.\nYakin hapus permanen?`)) return;
                } else {
                    if (!window.confirm(`Yakin hapus data piutang ${item.nama}?`)) return;
                }
                setPiutangs(piutangs.filter(p => p.id !== item.id));
            };

            return (
                <div className="w-full max-w-md mx-auto bg-gray-50 min-h-screen relative font-sans text-gray-800 shadow-2xl flex flex-col print:shadow-none print:max-w-full print:bg-white overflow-hidden">
                    
                    {/* Header */}
                    <header className="bg-blue-600 text-white p-4 shadow-md flex items-center print:hidden z-10 sticky top-0">
                        {currentView !== 'home' && (
                            <button onClick={() => setCurrentView('home')} className="mr-3 p-1 hover:bg-blue-700 rounded-full transition">
                                <IconChevronLeft />
                            </button>
                        )}
                        <h1 className="text-xl font-bold tracking-wide flex-1 text-center pr-8">
                            {currentView === 'home' && 'CATATAN PIUTANG'}
                            {currentView === 'add' && 'TAMBAH PIUTANG'}
                            {currentView === 'edit' && 'EDIT DATA'}
                            {currentView === 'pay' && 'INPUT PEMBAYARAN'}
                            {currentView === 'detail' && 'DETAIL PIUTANG'}
                            {currentView === 'receipt' && 'KUITANSI'}
                        </h1>
                    </header>

                    {/* Area Utama */}
                    <main className="flex-1 overflow-y-auto pb-24 print:pb-0 no-scrollbar">
                        
                        {/* --- BERANDA --- */}
                        {currentView === 'home' && (
                            <div className="p-4 space-y-6">
                                {/* Ringkasan */}
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-4">
                                    <div className="flex justify-between items-center pb-3 border-b border-gray-100">
                                        <span className="text-gray-500 text-sm font-medium">Total Piutang</span>
                                        <span className="text-gray-800 font-bold">{formatRupiah(totals.piutang)}</span>
                                    </div>
                                    <div className="flex justify-between items-center pb-3 border-b border-gray-100">
                                        <span className="text-gray-500 text-sm font-medium">Total Pembayaran</span>
                                        <span className="text-green-600 font-bold">{formatRupiah(totals.pembayaran)}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-gray-600 text-sm font-bold">Total Saldo Piutang</span>
                                        <span className="text-red-600 font-bold text-lg">{formatRupiah(totals.saldo)}</span>
                                    </div>
                                </div>

                                {/* Pencarian */}
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                        <IconSearch />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Cari nama debitur..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="pl-10 w-full p-3 border border-gray-200 rounded-xl bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                                    />
                                </div>

                                {/* Daftar List */}
                                <div className="space-y-4">
                                    <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wider pl-1">Daftar Piutang</h2>
                                    
                                    {filteredPiutangs.length === 0 ? (
                                        <div className="text-center py-10 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">
                                            <p>Belum ada data piutang.</p>
                                        </div>
                                    ) : (
                                        filteredPiutangs.map((item) => (
                                            <div key={item.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <h3 className="text-lg font-bold text-gray-800">{item.nama}</h3>
                                                        <span className={`inline-block mt-1 px-2 py-1 text-xs font-semibold rounded-md ${item.status === 'LUNAS' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                                                            {item.status}
                                                        </span>
                                                    </div>
                                                    <div className="flex gap-2 text-gray-400">
                                                        <button onClick={() => { setSelectedItem(item); setFormNama(item.nama); setFormPiutang(item.piutang.toString()); setCurrentView('edit'); }} className="p-2 bg-gray-50 rounded-lg hover:text-blue-600">
                                                            <IconEdit />
                                                        </button>
                                                        <button onClick={() => handleDelete(item)} className="p-2 bg-gray-50 rounded-lg hover:text-red-600">
                                                            <IconTrash />
                                                        </button>
                                                    </div>
                                                </div>
                                                
                                                <div className="space-y-2 mb-5 text-sm">
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-500">Piutang:</span>
                                                        <span className="font-medium">{formatRupiah(item.piutang)}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-500">Pembayaran:</span>
                                                        <span className="font-medium text-green-600">{formatRupiah(item.total_pembayaran)}</span>
                                                    </div>
                                                    <div className="flex justify-between pt-2 border-t border-gray-100">
                                                        <span className="font-bold text-gray-700">Saldo:</span>
                                                        <span className="font-bold text-red-600">{formatRupiah(item.saldo)}</span>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 gap-2">
                                                    <button onClick={() => { setSelectedItem(item); setCurrentView('detail'); }} className="flex items-center justify-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm font-semibold transition">
                                                        <IconInfo /> Detail
                                                    </button>
                                                    {item.saldo > 0 ? (
                                                        <button onClick={() => { setSelectedItem(item); setFormPayment(''); setCurrentView('pay'); }} className="flex items-center justify-center gap-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">
                                                            <IconCreditCard /> Bayar
                                                        </button>
                                                    ) : (
                                                        <button onClick={() => { setSelectedItem(item); setCurrentView('detail'); }} className="flex items-center justify-center gap-1 bg-green-500 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">
                                                            Lihat Kuitansi
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                
                                {/* Tombol Tambah (FAB) */}
                                <button 
                                    onClick={() => { setFormNama(''); setFormPiutang(''); setCurrentView('add'); }}
                                    className="fixed bottom-6 right-6 lg:absolute lg:bottom-6 lg:right-6 bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:bg-blue-700 transition transform hover:scale-105"
                                >
                                    <IconPlus />
                                </button>
                            </div>
                        )}

                        {/* --- FORM TAMBAH / EDIT --- */}
                        {(currentView === 'add' || currentView === 'edit') && (
                            <div className="p-4">
                                <form onSubmit={currentView === 'add' ? handleAddSubmit : handleEditSubmit} className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Nama Debitur</label>
                                        <input type="text" required value={formNama} onChange={(e) => setFormNama(e.target.value)} placeholder="Contoh: Budi" className="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Jumlah Piutang</label>
                                        <div className="relative">
                                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">Rp</span>
                                            <input type="number" required value={formPiutang} onChange={(e) => setFormPiutang(e.target.value)} placeholder="5000000" className="w-full p-3 pl-10 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-blue-700 transition">
                                        Simpan Data
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* --- FORM PEMBAYARAN --- */}
                        {currentView === 'pay' && selectedItem && (
                            <div className="p-4">
                                <form onSubmit={handlePaySubmit} className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-5">
                                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-2">
                                        <p className="text-sm text-blue-800">Pembayaran untuk:</p>
                                        <p className="font-bold text-lg text-blue-900">{selectedItem.nama}</p>
                                        <div className="mt-2 flex justify-between text-sm">
                                            <span className="text-blue-700">Sisa Saldo:</span>
                                            <span className="font-bold text-red-600">{formatRupiah(selectedItem.saldo)}</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Jumlah Pembayaran</label>
                                        <div className="relative">
                                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">Rp</span>
                                            <input type="number" required value={formPayment} onChange={(e) => setFormPayment(e.target.value)} placeholder="Contoh: 1000000" className="w-full p-3 pl-10 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-green-500 outline-none" />
                                        </div>
                                    </div>
                                    
                                    <button type="submit" className="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-green-700 transition flex justify-center items-center gap-2">
                                        <IconCreditCard /> Simpan Pembayaran
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* --- DETAIL PIUTANG --- */}
                        {currentView === 'detail' && selectedItem && (
                            <div className="p-4 space-y-6">
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-sm space-y-3">
                                    <h2 className="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">Nama: {selectedItem.nama}</h2>
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Piutang Awal:</span>
                                        <span className="font-medium text-gray-800">{formatRupiah(selectedItem.piutang)}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-500">Total Pembayaran:</span>
                                        <span className="font-medium text-green-600">{formatRupiah(selectedItem.total_pembayaran)}</span>
                                    </div>
                                    <div className="flex justify-between pt-2 border-t border-gray-100 text-base">
                                        <span className="font-bold text-gray-700">Saldo Piutang:</span>
                                        <span className="font-bold text-red-600">{formatRupiah(selectedItem.saldo)}</span>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-gray-700 mb-3 pl-1">Riwayat Pembayaran</h3>
                                    {selectedItem.pembayaran.length === 0 ? (
                                        <div className="text-center py-8 bg-gray-100 rounded-xl text-gray-500 text-sm">Belum ada pembayaran.</div>
                                    ) : (
                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-gray-50 text-gray-600 border-b border-gray-200">
                                                    <tr>
                                                        <th className="p-3 font-semibold">Tgl</th>
                                                        <th className="p-3 font-semibold">Bayar</th>
                                                        <th className="p-3 font-semibold text-center">Cetak</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {selectedItem.pembayaran.map((pay) => (
                                                        <tr key={pay.id} className="border-b border-gray-100">
                                                            <td className="p-3 text-gray-500">{new Date(pay.tanggal).toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit', year:'2-digit'})}</td>
                                                            <td className="p-3 font-medium text-green-600">{formatRupiah(pay.jumlah)}</td>
                                                            <td className="p-3 text-center">
                                                                <button onClick={() => { setSelectedPayment(pay); setCurrentView('receipt'); }} className="text-blue-600 bg-blue-50 p-2 rounded-lg hover:bg-blue-100">
                                                                    <IconReceipt />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- KUITANSI CETAK --- */}
                        {currentView === 'receipt' && selectedItem && selectedPayment && (
                            <div className="p-4 print:p-0 h-full flex flex-col">
                                <div className="bg-white border-2 border-gray-800 p-6 rounded-lg mb-6 shadow-sm print:shadow-none print:border-none print:rounded-none">
                                    <div className="text-center border-b-2 border-gray-800 pb-4 mb-5">
                                        <h2 className="text-xl font-bold tracking-widest text-gray-900">KUITANSI PEMBAYARAN</h2>
                                        <p className="text-sm text-gray-600 mt-1 uppercase tracking-widest">Catatan Piutang</p>
                                    </div>
                                    <div className="space-y-4 text-sm text-gray-800">
                                        <div className="flex justify-between border-b border-gray-200 pb-1">
                                            <span className="font-semibold w-32">No. Kuitansi</span>
                                            <span className="text-right flex-1">{selectedPayment.nomor_kuitansi}</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-200 pb-1">
                                            <span className="font-semibold w-32">Tanggal</span>
                                            <span className="text-right flex-1">{formatDate(selectedPayment.tanggal)}</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-200 pb-1">
                                            <span className="font-semibold w-32">Diterima dari</span>
                                            <span className="text-right flex-1 font-bold text-base uppercase">{selectedItem.nama}</span>
                                        </div>
                                        <div className="flex justify-between border-b border-gray-200 pb-1 items-center">
                                            <span className="font-semibold w-32">Sejumlah</span>
                                            <span className="text-right flex-1 font-bold text-xl bg-gray-100 px-3 py-1 rounded">{formatRupiah(selectedPayment.jumlah)}</span>
                                        </div>
                                    </div>
                                    <div className="mt-6 bg-gray-50 p-4 rounded-lg text-xs space-y-2 border border-gray-200">
                                        <div className="flex justify-between text-gray-500">
                                            <span>Piutang Awal:</span><span>{formatRupiah(selectedItem.piutang)}</span>
                                        </div>
                                        <div className="flex justify-between font-bold text-sm pt-2 border-t border-gray-200">
                                            <span>Sisa Piutang:</span><span>{formatRupiah(selectedPayment.saldo_setelah_pembayaran)}</span>
                                        </div>
                                    </div>
                                    <div className="mt-8 flex justify-between items-end">
                                        <div className="text-center font-bold">
                                            <div className={`px-4 py-2 border-2 ${selectedPayment.saldo_setelah_pembayaran <= 0 ? 'border-green-600 text-green-600' : 'border-amber-500 text-amber-500'} transform -rotate-12 rounded opacity-80 uppercase tracking-widest`}>
                                                {selectedPayment.saldo_setelah_pembayaran <= 0 ? 'LUNAS' : 'BELUM LUNAS'}
                                            </div>
                                        </div>
                                        <div className="text-center w-40">
                                            <p className="mb-12 text-sm text-gray-600">Penerima,</p>
                                            <div className="border-b border-gray-800"></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="print:hidden space-y-3 mt-auto">
                                    <button onClick={() => window.print()} className="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-blue-700 flex justify-center items-center gap-2">
                                        <IconPrint /> Cetak / PDF
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
